# Маркеры риторических тиков LLM для русского.

antithesis:
  - 'не\s+\S+[^.!?]{0,40}\bа\s'
  - 'дело\s+не\s+в[^.!?]{0,40}\bа\s+в'
  - 'это\s+не[^.!?]{0,30}\bэто\s'

simile_markers:
  - '\bкак\b'
  - '\bбудто\b'
  - '\bсловно\b'
  - '\bподобно\b'
  - '\bнапоминает\b'
  - '\bточно\s+(?:это|он|она|они)\b'

conclusive_markers:
  - '\bозначает\b'
  - '\bсимволизирует\b'
  - '\bпредставляет\s+собой\b'
  - '\bсловом\b'
  - '\bв\s+итоге\b'
  - '\bпо\s+сути\b'

# В отличие от английского списка (en.yaml) — не опирается на крупное
# корпусное исследование (такого для русского не нашлось), это подборка по
# общему наблюдению за типичными оборотами русскоязычных LLM-ответов.
# Менее надёжно, чем EN-список — держим вес правила ниже (см. score()).
tell_words:
  - '\bиграет\s+важн(?:ую|ейшую)\s+роль\b'
  - '\bстоит\s+отметить\b'
  - '\bважно\s+(?:отметить|понимать|подчеркнуть)\b'
  - '\bнеобходимо\s+подчеркнуть\b'
  - '\bв\s+современном\s+мире\b'
  - '\bпогрузиться\b'
  - '\bраскрыть\s+потенциал\b'
  - '\bуникальн(?:ый|ая|ое|ые)\b'
  - '\bинновационн(?:ый|ая|ое|ые)\b'
  - '\bкомплексн(?:ый|ая|ое|ые)\s+подход\b'
  - '\bмногогранн(?:ый|ая|ое|ые)\b'
  - '\bнеотъемлем(?:ый|ая|ое|ые)\b'
  - '\bбезусловно\b'
  - '\bнесомненно\b'
  - '\bключев(?:ую|ой|ая)\s+роль\b'
  - '\bособое\s+внимание\b'
  - '\bподводя\s+итог\b'
  - '\bтаким\s+образом\b'

dash_char: "—"
short_clause_max_words: 4
triad_min_run: 3
