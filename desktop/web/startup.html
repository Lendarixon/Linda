<style>
/* Panorama: supplied artwork fills the window, with a cropped Metro title. */
#lindaStartup{position:fixed;inset:0;z-index:100000;background:#111318;color:#f4f5f7;overflow:auto;font:16px/1.5 'Segoe UI',sans-serif}
#lindaStartup[hidden]{display:none!important}
.startup-card{position:relative;width:100%;min-height:100vh;overflow:hidden;background:#111318}
.startup-art{position:absolute;inset:0;overflow:hidden}
.startup-art svg{display:block;width:100%;height:100%;object-fit:cover}
.startup-card::after{content:'';position:absolute;inset:0;pointer-events:none;background:linear-gradient(90deg,rgba(17,19,24,.96) 0,rgba(17,19,24,.84) 34%,rgba(17,19,24,.18) 78%)}
.startup-content{position:relative;z-index:1;min-height:100vh}
.startup-brand{display:contents}
.startup-icon{position:absolute;right:3vw;top:3vw;width:clamp(40px,4.4vw,84px);height:clamp(40px,4.4vw,84px);background:#1ba1e2;padding:7px;box-sizing:border-box}
.startup-icon svg{display:block;width:100%;height:100%}
.startup-name{position:absolute;left:-.9vw;top:7vw;font-size:14.5vw;font-weight:300;line-height:.9;letter-spacing:-.03em;white-space:nowrap}
.startup-tagline{position:absolute;left:4vw;top:24vw;font-size:clamp(20px,2.3vw,44px);font-weight:300;color:#e0e3e8;max-width:80vw}
.startup-version{position:absolute;right:9vw;top:3.6vw;font-size:clamp(16px,1.7vw,32px);font-variant-numeric:tabular-nums}
.startup-foot{position:absolute;left:4vw;bottom:4vh;width:min(650px,56vw);max-width:92vw;display:grid;gap:8px}
.startup-status{font-size:clamp(19px,1.7vw,28px);font-weight:400}
.startup-models,.startup-note{color:#d4d8df;font-size:14px;overflow-wrap:anywhere}
.startup-dots{display:flex;gap:12px;height:26px;align-items:center;margin:2px 0}
.startup-dots i{height:6px;width:6px;background:#fff;animation:startup-pulse 1.5s infinite;opacity:.25}
.startup-dots i:nth-child(2){animation-delay:.15s}.startup-dots i:nth-child(3){animation-delay:.3s}.startup-dots i:nth-child(4){animation-delay:.45s}.startup-dots i:nth-child(5){animation-delay:.6s}
@keyframes startup-pulse{0%,80%,100%{opacity:.25;transform:translateX(0)}40%{opacity:1;transform:translateX(12px)}}
@media(prefers-reduced-motion:reduce){.startup-dots i{animation:none;opacity:1}}
#startupContinue{justify-self:start;margin-top:8px;background:#111318;color:inherit;border:1px solid #8a91a0;padding:10px 18px;font:inherit;cursor:pointer}
#startupContinue:focus-visible{outline:3px solid #1ba1e2;outline-offset:3px}
html[data-theme=light] #lindaStartup{background:#f2f3f5;color:#15171b}
html[data-theme=light] .startup-card::after{background:linear-gradient(90deg,rgba(245,246,248,.98) 0,rgba(245,246,248,.93) 42%,rgba(245,246,248,.2) 90%)}
html[data-theme=light] .startup-tagline,html[data-theme=light] .startup-models,html[data-theme=light] .startup-note{color:#303640}
html[data-theme=light] .startup-dots i{background:#15171b}
html[data-theme=light] #startupContinue{background:#f5f6f8;border-color:#50555e}
html[data-theme=contrast] .startup-card::after{background:linear-gradient(90deg,#000 0,rgba(0,0,0,.96) 50%,rgba(0,0,0,.6) 100%)}
html[data-theme=contrast] #lindaStartup,html[data-theme=contrast] .startup-tagline,html[data-theme=contrast] .startup-models,html[data-theme=contrast] .startup-note{color:#fff}
@media(max-width:600px){.startup-name{top:16vh;font-size:30vw;left:-1.8vw}.startup-tagline{top:36vh;left:6vw;font-size:22px;max-width:88vw}.startup-icon{top:24px;right:6vw}.startup-version{top:31px;right:calc(6vw + 56px)}.startup-foot{left:6vw;width:88vw;max-width:88vw;bottom:5vh}.startup-card::after{background:linear-gradient(90deg,rgba(17,19,24,.96),rgba(17,19,24,.65))}}

.startup-frame{position:absolute;inset:0;opacity:0;transition:opacity .8s ease}
.startup-frame.is-active{opacity:1}
@media(prefers-reduced-motion:reduce){.startup-frame{transition:none}}

<script>
(function(){
 const copy={
  en:{tag:'AI text detector',loading:'Loading your models…',warming:'Warming up the models…',pending:'Starting Linda…',error:'The models could not be prepared',note:'Analysis runs locally on this computer.',slow:'The first start can take longer. You can open the app while preparation continues.',offline:'Waiting for the local service…',go:'Open the app',auto:'Automatic model selection',cpu:'Processor',gpu:'Graphics card'},
  pl:{tag:'Detektor tekstów AI',loading:'Ładowanie Twoich modeli…',warming:'Rozgrzewanie modeli…',pending:'Uruchamianie Linda…',error:'Nie udało się przygotować modeli',note:'Analiza odbywa się lokalnie na tym komputerze.',slow:'Pierwsze uruchomienie może potrwać dłużej. Możesz otworzyć aplikację w trakcie przygotowania.',offline:'Oczekiwanie na usługę lokalną…',go:'Otwórz aplikację',auto:'Automatyczny wybór modelu',cpu:'Procesor',gpu:'Karta graficzna'},
  ru:{tag:'Детектор ИИ-текста',loading:'Загрузка ваших моделей…',warming:'Прогрев моделей…',pending:'Запуск Linda…',error:'Не удалось подготовить модели',note:'Анализ выполняется локально на этом компьютере.',slow:'Первый запуск может занять больше времени. Можно открыть приложение, пока подготовка продолжается.',offline:'Ожидание локальной службы…',go:'Открыть приложение',auto:'Автоматический выбор модели',cpu:'Процессор',gpu:'Видеокарта'}
 };
 const boot=window.LINDA_BOOT||{}, el=document.getElementById('lindaStartup');
 let dismissed=false, last=Date.now(), state=null, started=Date.now();
 // Keep ownership of each lock even when the desktop shell reparents a node.
 // Releasing only today's body children left moved editors permanently inert.
 const locks=new Map();
 window.LINDA_modalLock=function(owner,nodes,on){
  if(on)for(const n of nodes){
   let entry=locks.get(n);if(!entry){entry={initial:n.inert,owners:new Set()};locks.set(n,entry);}
   entry.owners.add(owner);n.inert=true;
  }
  else for(const [n,entry] of locks){
   entry.owners.delete(owner);
   if(!entry.owners.size){n.inert=entry.initial;locks.delete(n);}
  }
 };
 function show(on){el.hidden=!on;window.LINDA_modalLock('startup',[...document.body.children].filter(n=>n!==el&&!['SCRIPT','STYLE'].includes(n.tagName)),on);}
 function render(s){
  if(s){state=s;last=Date.now();}
  const st=(state&&state.settings)||boot.settings||{}, lang=st.language||boot.language||'en', t=copy[lang]||copy.en;
  const phase=state&&state.startup?state.startup.phase:'pending';
  const enabled=st.preload!==false && (!state||state.models_ready) && !['ready','skipped'].includes(phase) && !dismissed;
  show(enabled);
  if(!enabled) return;
  document.getElementById('startupTagline').textContent=t.tag;
  document.getElementById('startupStatus').textContent=Date.now()-last>12000?t.offline:(t[phase]||t.loading);
  const eng=state&&state.engine, quality=st.quality||'auto';
  const model=eng&&eng.phase==='ready'?(eng.tier==='speed'?'Linda Loupe':'Linda Assay'):({lite:'Linda Loupe',speed:'Linda Loupe',pro:'Linda Assay',full:'Linda Assay',both:'Linda Assay + Linda Loupe'}[quality]||t.auto);
  document.getElementById('startupModels').textContent=model+(eng?' · '+(eng.device==='cpu'?t.cpu:t.gpu):'')+(state&&state.installed_version?' · '+state.installed_version:'');
  const slow=Date.now()-started>30000;
  document.getElementById('startupNote').textContent=phase==='error'?t.note:(slow?t.slow:t.note);
  const button=document.getElementById('startupContinue');button.hidden=phase!=='error'&&!slow;button.textContent=t.go;
 }
 document.getElementById('startupContinue').onclick=function(){dismissed=true;show(false);const input=document.getElementById('textInput');if(input)input.focus();};
 window.LINDA_startupRender=render;
 const settings=boot.settings||{};
 if(settings.theme)document.documentElement.dataset.theme=settings.theme;
 render();
 document.addEventListener('DOMContentLoaded',function(){render();if(!el.hidden)el.focus();});
 const frames=Array.from(el.querySelectorAll('.startup-frame'));
 let frameIndex=0;
 const artworkTimer=setInterval(function(){
  if(el.hidden){clearInterval(artworkTimer);return;}
  frames[frameIndex].classList.remove('is-active');
  frameIndex=(frameIndex+1)%frames.length;
  frames[frameIndex].classList.add('is-active');
 },6000);
 const timer=setInterval(function(){if(dismissed||(state&&state.startup&&['ready','skipped'].includes(state.startup.phase))){clearInterval(timer);return;}render();},1000);
})();
</script>
