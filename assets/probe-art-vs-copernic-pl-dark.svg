<svg xmlns="http://www.w3.org/2000/svg" xml:lang="pl" width="600" height="464" viewBox="0 0 600 464" role="img" aria-labelledby="title"><title id="title">Co pasuje do Twoich potrzeb</title><rect x="1" y="1" width="598" height="462" rx="0" fill="#191c20" stroke="#31363c" stroke-width="2"/><g font-family="Segoe UI Variable Text, Segoe UI, system-ui, sans-serif"><text x="28" y="49" font-size="28" font-weight="600" fill="#eceff2"><tspan x="28" dy="0">Co pasuje do Twoich potrzeb</tspan></text><rect x="24" y="80" width="268" height="360" rx="0" fill="#202429" stroke="#31363c"/><text x="40" y="123" font-size="27" font-weight="600" fill="#eceff2"><tspan x="40" dy="0">Copernic</tspan></text><path d="M40 145 H276" stroke="#6c747d" stroke-width="4"/><text x="40" y="178" font-size="22" fill="#eceff2"><tspan x="40" dy="0">Rozszerzenia poczty i</tspan><tspan x="40" dy="30">chmury</tspan></text><text x="40" y="258" font-size="22" fill="#eceff2"><tspan x="40" dy="0">Lokalne pliki i poczta</tspan><tspan x="40" dy="30">offline</tspan></text><text x="40" y="338" font-size="22" fill="#eceff2"><tspan x="40" dy="0">OCR i wyszukiwanie</tspan><tspan x="40" dy="30">semantyczne; zależne</tspan><tspan x="40" dy="30">od pakietu</tspan></text><rect x="308" y="80" width="268" height="360" rx="0" fill="#202429" stroke="#31363c"/><text x="324" y="123" font-size="27" font-weight="600" fill="#eceff2"><tspan x="324" dy="0">Linda Probe</tspan></text><path d="M324 145 H560" stroke="#5ecbcb" stroke-width="4"/><text x="324" y="178" font-size="22" fill="#eceff2"><tspan x="324" dy="0">Działa offline</tspan></text><text x="324" y="228" font-size="22" fill="#eceff2"><tspan x="324" dy="0">Pro: lokalny OCR</tspan><tspan x="324" dy="30">skanów</tspan></text><text x="324" y="308" font-size="22" fill="#eceff2"><tspan x="324" dy="0">Pro: wyszukiwanie</tspan><tspan x="324" dy="30">według znaczenia</tspan></text></g></svg>
