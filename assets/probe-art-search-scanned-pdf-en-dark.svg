<svg xmlns="http://www.w3.org/2000/svg" xml:lang="en" width="560" height="790" viewBox="0 0 560 790" role="img" aria-labelledby="title">
<title id="title">From a scan to searchable text</title>
<rect x="1" y="1" width="558" height="788" rx="0" fill="#191c20" stroke="#31363c" stroke-width="2"/>
<g font-family="Segoe UI Variable Text, Segoe UI, system-ui, sans-serif">
<text x="26" y="48" font-size="29" font-weight="600" fill="#eceff2"><tspan x="26" dy="0">From a scan to searchable text</tspan></text>
<rect x="26" y="82" width="508" height="142" rx="0" fill="#202429" stroke="#31363c"/>
<path d="M47 109 h25 l12 12 v40 H47 Z M72 109 v12 h12" fill="#202429" stroke="#5ecbcb" stroke-width="3"/>
<text x="108" y="121" font-size="28" font-weight="600" fill="#eceff2"><tspan x="108" dy="0">Scanned page</tspan></text>
<text x="108" y="159" font-size="27" fill="#eceff2"><tspan x="108" dy="0">An image without a text</tspan><tspan x="108" dy="35">layer</tspan></text>
<path d="M280 231 v20 m-7 -7 l7 7 7 -7" fill="none" stroke="#5ecbcb" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="26" y="260" width="508" height="142" rx="0" fill="#202429" stroke="#31363c"/>
<rect x="46" y="289" width="38" height="45" rx="0" fill="#202429" stroke="#5ecbcb" stroke-width="3"/><path d="M54 301 h22 M54 312 h22 M54 323 h22" stroke="#5ecbcb" stroke-width="3"/>
<text x="108" y="299" font-size="28" font-weight="600" fill="#eceff2"><tspan x="108" dy="0">Local OCR</tspan></text>
<text x="108" y="337" font-size="27" fill="#eceff2"><tspan x="108" dy="0">Probe Pro recognises text</tspan><tspan x="108" dy="35">on your PC</tspan></text>
<path d="M280 409 v20 m-7 -7 l7 7 7 -7" fill="none" stroke="#5ecbcb" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="26" y="438" width="508" height="142" rx="0" fill="#202429" stroke="#31363c"/>
<path d="M47 465 h25 l12 12 v40 H47 Z M72 465 v12 h12" fill="#202429" stroke="#5ecbcb" stroke-width="3"/>
<path d="M55 489 h21 M55 500 h21" stroke="#5ecbcb" stroke-width="3"/>
<text x="108" y="477" font-size="28" font-weight="600" fill="#eceff2"><tspan x="108" dy="0">Searchable text</tspan></text>
<text x="108" y="515" font-size="27" fill="#eceff2"><tspan x="108" dy="0">Added to the local index</tspan></text>
<rect x="26" y="630" width="508" height="130" rx="0" fill="#202429"/>
<text x="48" y="677" font-size="27" fill="#eceff2"><tspan x="48" dy="0">OCR can make mistakes.</tspan><tspan x="48" dy="35">Check against the original.</tspan></text>
</g></svg>
