<svg xmlns="http://www.w3.org/2000/svg" xml:lang="en" width="600" height="429" viewBox="0 0 600 429" role="img" aria-labelledby="title"><title id="title">Reasons to choose each tool</title><rect x="1" y="1" width="598" height="427" rx="0" fill="#191c20" stroke="#31363c" stroke-width="2"/><g font-family="Segoe UI Variable Text, Segoe UI, system-ui, sans-serif"><text x="28" y="49" font-size="28" font-weight="600" fill="#eceff2"><tspan x="28" dy="0">Reasons to choose each tool</tspan></text><rect x="24" y="80" width="268" height="325" rx="0" fill="#202429" stroke="#31363c"/><text x="40" y="123" font-size="27" font-weight="600" fill="#eceff2"><tspan x="40" dy="0">dtSearch</tspan></text><path d="M40 145 H276" stroke="#6c747d" stroke-width="4"/><text x="40" y="178" font-size="22" fill="#eceff2"><tspan x="40" dy="0">Folders, email,</tspan><tspan x="40" dy="30">databases</tspan></text><text x="40" y="264" font-size="22" fill="#eceff2"><tspan x="40" dy="0">Web content</tspan><tspan x="40" dy="30">with Spider</tspan></text><text x="40" y="350" font-size="22" fill="#eceff2"><tspan x="40" dy="0">Highlighted hits</tspan></text><rect x="308" y="80" width="268" height="325" rx="0" fill="#202429" stroke="#31363c"/><text x="324" y="123" font-size="27" font-weight="600" fill="#eceff2"><tspan x="324" dy="0">Linda Probe</tspan></text><path d="M324 145 H560" stroke="#5ecbcb" stroke-width="4"/><text x="324" y="178" font-size="22" fill="#eceff2"><tspan x="324" dy="0">Runs offline</tspan></text><text x="324" y="264" font-size="22" fill="#eceff2"><tspan x="324" dy="0">Pro: local OCR</tspan><tspan x="324" dy="30">for scans</tspan></text><text x="324" y="350" font-size="22" fill="#eceff2"><tspan x="324" dy="0">Pro: search by</tspan><tspan x="324" dy="30">meaning</tspan></text></g></svg>
