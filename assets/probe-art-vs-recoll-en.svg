<svg xmlns="http://www.w3.org/2000/svg" xml:lang="en" width="600" height="399" viewBox="0 0 600 399" role="img" aria-labelledby="title"><title id="title">Reasons to choose each tool</title><rect x="1" y="1" width="598" height="397" rx="18" fill="#f1f6fa" stroke="#b8cbdc" stroke-width="2"/><g font-family="system-ui, -apple-system, Segoe UI, sans-serif"><text x="28" y="49" font-size="28" font-weight="600" fill="#233c56"><tspan x="28" dy="0">Reasons to choose each tool</tspan></text><rect x="24" y="80" width="268" height="295" rx="12" fill="#fff" stroke="#b8cbdc"/><text x="40" y="123" font-size="27" font-weight="600" fill="#233c56"><tspan x="40" dy="0">Recoll</tspan></text><path d="M40 145 H276" stroke="#518b8f" stroke-width="4"/><text x="40" y="178" font-size="22" fill="#233c56"><tspan x="40" dy="0">GPL source code</tspan></text><text x="40" y="234" font-size="22" fill="#233c56"><tspan x="40" dy="0">Linux, Windows,</tspan><tspan x="40" dy="30">macOS</tspan></text><text x="40" y="320" font-size="22" fill="#233c56"><tspan x="40" dy="0">Contents, archives,</tspan><tspan x="40" dy="30">email attachments</tspan></text><rect x="308" y="80" width="268" height="295" rx="12" fill="#fff" stroke="#b8cbdc"/><text x="324" y="123" font-size="27" font-weight="600" fill="#233c56"><tspan x="324" dy="0">Linda Probe</tspan></text><path d="M324 145 H560" stroke="#518b8f" stroke-width="4"/><text x="324" y="178" font-size="22" fill="#233c56"><tspan x="324" dy="0">Windows only</tspan></text><text x="324" y="234" font-size="22" fill="#233c56"><tspan x="324" dy="0">Pro: local OCR</tspan><tspan x="324" dy="30">for scans</tspan></text><text x="324" y="320" font-size="22" fill="#233c56"><tspan x="324" dy="0">Pro: search by</tspan><tspan x="324" dy="30">meaning</tspan></text></g></svg>
