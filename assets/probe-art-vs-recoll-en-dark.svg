<svg xmlns="http://www.w3.org/2000/svg" xml:lang="en" width="600" height="514" viewBox="0 0 600 514" role="img" aria-labelledby="title"><title id="title">Reasons to choose each tool</title><rect x="1" y="1" width="598" height="512" rx="0" fill="#191c20" stroke="#31363c" stroke-width="2"/><g font-family="Segoe UI Variable Text, Segoe UI, system-ui, sans-serif"><text x="28" y="49" font-size="28" font-weight="600" fill="#eceff2"><tspan x="28" dy="0">Reasons to choose each tool</tspan></text><rect x="24" y="80" width="268" height="410" rx="0" fill="#202429" stroke="#31363c"/><text x="40" y="123" font-size="27" font-weight="600" fill="#eceff2"><tspan x="40" dy="0">Recoll</tspan></text><path d="M40 145 H276" stroke="#6c747d" stroke-width="4"/><text x="40" y="178" font-size="22" fill="#eceff2"><tspan x="40" dy="0">GPL source code</tspan></text><text x="40" y="228" font-size="22" fill="#eceff2"><tspan x="40" dy="0">Linux, Windows, macOS</tspan></text><text x="40" y="278" font-size="22" fill="#eceff2"><tspan x="40" dy="0">Contents, archives,</tspan><tspan x="40" dy="30">email attachments</tspan></text><text x="40" y="358" font-size="22" fill="#eceff2"><tspan x="40" dy="0">PDF OCR with external</tspan><tspan x="40" dy="30">tools; image metadata</tspan><tspan x="40" dy="30">and configurable image</tspan><tspan x="40" dy="30">OCR</tspan></text><rect x="308" y="80" width="268" height="410" rx="0" fill="#202429" stroke="#31363c"/><text x="324" y="123" font-size="27" font-weight="600" fill="#eceff2"><tspan x="324" dy="0">Linda Probe</tspan></text><path d="M324 145 H560" stroke="#5ecbcb" stroke-width="4"/><text x="324" y="178" font-size="22" fill="#eceff2"><tspan x="324" dy="0">Runs offline</tspan></text><text x="324" y="228" font-size="22" fill="#eceff2"><tspan x="324" dy="0">Pro: local OCR for scans</tspan></text><text x="324" y="278" font-size="22" fill="#eceff2"><tspan x="324" dy="0">Pro: search by meaning</tspan></text></g></svg>
